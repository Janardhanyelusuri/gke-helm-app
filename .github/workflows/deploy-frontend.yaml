name: Deploy Frontend to GKE

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'helm/frontend/**'
      - '.github/workflows/deploy-frontend.yaml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}
  GAR_LOCATION: ${{ secrets.GAR_LOCATION }}
  REPOSITORY: app-images
  IMAGE: frontend

jobs:
  build-and-deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SA_EMAIL }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Install GKE Auth Plugin
      run: |
        echo "Installing gke-gcloud-auth-plugin..."
        gcloud components install gke-gcloud-auth-plugin --quiet
    
    - name: Configure Docker for Artifact Registry
      run: |
        gcloud auth configure-docker ${GAR_LOCATION}-docker.pkg.dev
    
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${GKE_CLUSTER} \
          --zone ${GKE_ZONE} \
          --project ${PROJECT_ID}
    
    - name: Build Docker image
      run: |
        cd frontend
        
        REGISTRY="${GAR_LOCATION}-docker.pkg.dev"
        IMAGE_PATH="${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${IMAGE}"
        IMAGE_TAG="${IMAGE_PATH}:${{ github.sha }}"
        IMAGE_LATEST="${IMAGE_PATH}:latest"
        
        echo "Building: ${IMAGE_TAG}"
        docker build -t "${IMAGE_TAG}" .
        docker tag "${IMAGE_TAG}" "${IMAGE_LATEST}"
    
    - name: Push Docker image
      run: |
        REGISTRY="${GAR_LOCATION}-docker.pkg.dev"
        IMAGE_PATH="${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${IMAGE}"
        IMAGE_TAG="${IMAGE_PATH}:${{ github.sha }}"
        IMAGE_LATEST="${IMAGE_PATH}:latest"
        
        echo "Pushing: ${IMAGE_TAG}"
        docker push "${IMAGE_TAG}"
        docker push "${IMAGE_LATEST}"
    
    - name: Set up Helm
      uses: azure/setup-helm@v3
      with:
        version: 'v3.12.0'
    
    - name: Update Helm values
      run: |
        sed -i "s|PROJECT_ID|${PROJECT_ID}|g" helm/frontend/values.yaml
    
    - name: Deploy with Helm
      run: |
        helm upgrade --install frontend ./helm/frontend \
          --set image.tag=${{ github.sha }} \
          --wait \
          --timeout 5m
    
    - name: Verify deployment
      run: |
        kubectl rollout status deployment/frontend
        kubectl get pods -l app.kubernetes.io/name=frontend
    
    - name: Deployment Summary
      run: |
        echo "✅ Frontend deployed successfully!"
        REGISTRY="${GAR_LOCATION}-docker.pkg.dev"
        echo "Image: ${REGISTRY}/${PROJECT_ID}/${REPOSITORY}/${IMAGE}:${{ github.sha }}"
