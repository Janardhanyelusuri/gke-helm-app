name: Deploy Ingress

on:
  push:
    branches:
      - main
    paths:
      - 'helm/ingress/**'
      - '.github/workflows/deploy-ingress.yaml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: ${{ secrets.GKE_CLUSTER }}
  GKE_ZONE: ${{ secrets.GKE_ZONE }}

jobs:
  deploy-ingress:
    name: Deploy Ingress
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
        service_account: ${{ secrets.GCP_SA_EMAIL }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2
    
    - name: Get GKE credentials
      run: |
        gcloud container clusters get-credentials ${{ env.GKE_CLUSTER }} \
          --zone ${{ env.GKE_ZONE }} \
          --project ${{ env.PROJECT_ID }}
    
    - name: Create static IP (if not exists)
      run: |
        if ! gcloud compute addresses describe app-static-ip --global --project=${{ env.PROJECT_ID }} 2>/dev/null; then
          gcloud compute addresses create app-static-ip --global --project=${{ env.PROJECT_ID }}
        fi
    
    - name: Get static IP
      run: |
        IP=$(gcloud compute addresses describe app-static-ip --global --project=${{ env.PROJECT_ID }} --format="value(address)")
        echo "Static IP: $IP"
    
    - name: Apply Ingress
      run: |
        kubectl apply -f helm/ingress/ingress.yaml
    
    - name: Wait for Ingress
      run: |
        kubectl wait --for=condition=Available --timeout=300s ingress/app-ingress || true
    
    - name: Deployment Summary
      run: |
        echo "✅ Ingress deployed successfully!"
        kubectl get ingress app-ingress
