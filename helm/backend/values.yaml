replicaCount: 2

image:
  repository: us-central1-docker.pkg.dev/PROJECT_ID/app-images/backend
  pullPolicy: Always
  tag: "latest"

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

env:
  - name: ENV
    value: "production"
  - name: PORT
    value: "8080"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: github-actions-deployer@PROJECT_ID.iam.gserviceaccount.com
  name: "backend-sa"
